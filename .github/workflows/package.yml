# Build the raylib GUI natively on each OS and zip it with scripts/package.sh.
# Push a v* tag to attach the zips to a GitHub Release.
name: package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Which build to run
        type: choice
        default: all
        options: [all, linux-x64, mac-aarch64, mac-x64, windows-x64]

permissions:
  contents: write

jobs:
  # `matrix` is not available in a job-level `if`, so pick the targets here.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          TARGET: ${{ inputs.target }}
        run: |
          python3 - <<'PY' >>"$GITHUB_OUTPUT"
          import json, os
          # Oldest Linux image on purpose: the binary needs the glibc it was
          # built against (2.35 here), so never build on a rolling distro.
          every = [
              {"name": "linux-x64", "os": "ubuntu-22.04"},
              {"name": "mac-aarch64", "os": "macos-15"},
              {"name": "mac-x64", "os": "macos-15-intel"},
              {"name": "windows-x64", "os": "windows-latest"},
          ]
          want = os.environ.get("TARGET") or "all"
          picked = [t for t in every if want in ("all", t["name"])]
          print("matrix=" + json.dumps({"include": picked}))
          PY

  package:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl-dev libasound2-dev zip

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2.0"
          dune-cache: false

      - name: Install OCaml dependencies
        run: opam install -y dune raylib ctypes yojson yojson-five

      - name: Package
        shell: bash
        run: opam exec -- sh scripts/package.sh
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Check glibc floor (Linux)
        if: runner.os == 'Linux'
        run: |
          max=$(objdump -T dist/*/mancer.bin | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "needs $max"
          [ "$(printf '%s\nGLIBC_2.35\n' "$max" | sort -V | tail -1)" = GLIBC_2.35 ]

      - name: List dynamic libraries
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) ldd dist/*/mancer.bin ;;
            macOS) otool -L dist/*/mancer.app/Contents/MacOS/gui ;;
            Windows) opam exec -- ldd dist/*/mancer.exe ;;
          esac

      # The package has to start on the machine it was built for: the game
      # opens a hidden window, loads its fonts and its art, and plays a few
      # seconds of a game. scripts/smoke.sh runs that check on the zip.
      - name: Software OpenGL for the check (Windows)
        id: mesa
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          # The runner has no GPU, and Windows' own OpenGL is 1.1 while
          # raylib wants 3.3: Mesa's llvmpipe gives it one in software.
          $release = Invoke-RestMethod https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest
          $asset = $release.assets | Where-Object { $_.name -like '*-release-mingw.7z' } | Select-Object -First 1
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mesa.7z
          $mesa = Join-Path $env:RUNNER_TEMP "mesa"
          & "${env:ProgramFiles}\7-Zip\7z.exe" x mesa.7z "-o$mesa" "x64/opengl32.dll" "x64/libgallium_wgl.dll" -y
          "MESA=$mesa" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Unpack the package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist/*.zip)[0]
          Remove-Item -Recurse -Force dist/.smoke -ErrorAction Ignore
          Expand-Archive -Path $zip.FullName -DestinationPath dist/.smoke
          if ("${{ steps.mesa.outcome }}" -eq "success") {
            # Mesa's OpenGL is only used when it sits next to the exe.
            Copy-Item "$env:MESA/x64/*.dll" (Get-ChildItem dist/.smoke -Directory)[0].FullName
          }

      - name: The package carries its runtime (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # The game links against the mingw runtime (libwinpthread-1.dll
          # for the threads of OCaml 5). A player's machine has none of
          # it, so the package has to ship it next to the exe.
          ls -1 dist/.smoke/mancer-*/*.dll
          ls dist/.smoke/mancer-*/libwinpthread-1.dll

      - name: Unpack the package (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          rm -rf dist/.smoke && mkdir -p dist/.smoke
          unzip -q dist/mancer-*.zip -d dist/.smoke

      - name: Check the package starts (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
          scripts/smoke.sh dist/.smoke/mancer-*

      - name: Check the package starts (macOS)
        if: runner.os == 'macOS'
        run: |
          # The macOS runners have no OpenGL at all (NSGL finds no pixel
          # format), so the game cannot open a window there: the package is
          # checked, and the bundle is read instead of the window.
          scripts/smoke.sh dist/.smoke/mancer-* --allow-missing-window
          # Gatekeeper wants a signed app: Apple Silicon refuses an unsigned
          # one, and this is the ad-hoc signature of the packager.
          codesign -dv dist/.smoke/mancer-*/mancer.app
          plutil -lint dist/.smoke/mancer-*/mancer.app/Contents/Info.plist

      - name: Check the package starts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ "${{ steps.mesa.outcome }}" = "success" ]; then
            export GALLIUM_DRIVER=llvmpipe LIBGL_ALWAYS_SOFTWARE=1
            scripts/smoke.sh dist/.smoke/mancer-*
          else
            scripts/smoke.sh dist/.smoke/mancer-* --allow-missing-window
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mancer-${{ matrix.name }}
          path: dist/*.zip

  release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: zips
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: zips/*.zip
